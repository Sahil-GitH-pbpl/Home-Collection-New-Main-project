services:
  nginx:
    image: nginx:1.27-alpine
    container_name: labmate-nginx-4672
    ports:
      - "4672:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/arpraandhc/Downloads/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /home/arpraandhc/Downloads/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arpra-neo-web
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Kolkata
      FLASK_SECRET_KEY: arpra-neo-dev-secret
      LEAD_API_KEY: ${LEAD_API_KEY:-}
      LEAD_API_CREATED_BY: ${LEAD_API_CREATED_BY:-Website API}
      DB_HOST: mariadb
      DB_USER: root
      DB_PASSWORD: arpra_root_pass
      DB_NAME: lead_management
      LABMATE_HOST: mariadb
      LABMATE_USER: root
      LABMATE_PASSWORD: arpra_root_pass
      LABMATE_NAME: labmate_data
      B7001_HOST: mariadb
      B7001_USER: root
      B7001_PASSWORD: arpra_root_pass
      B7001_NAME: bhasin_7001_new
      WA_PANEL_HOST: ${WA_PANEL_HOST:-mariadb}
      WA_PANEL_USER: ${WA_PANEL_USER:-root}
      WA_PANEL_PASSWORD: ${WA_PANEL_PASSWORD:-arpra_root_pass}
      WA_PANEL_NAME: ${WA_PANEL_NAME:-whatsapp}
      WA_PANEL_INCOMING_TABLE: ${WA_PANEL_INCOMING_TABLE:-ofc_waba_incoming}
      WA_PANEL_OUTGOING_TABLE: ${WA_PANEL_OUTGOING_TABLE:-ofc_waba_outgoing}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-disabled}
      NETCORE_URL: ${NETCORE_URL:-https://waapi.pepipost.com/api/v2/message/}
      NETCORE_MEDIA_URL: ${NETCORE_MEDIA_URL:-https://cpaaswa.netcorecloud.net/api/v2/media}
      NETCORE_TOKEN: ${NETCORE_TOKEN:-}
      NETCORE_SOURCE: ${NETCORE_SOURCE:-}
      NETCORE_IMAGE_TEMPLATE: ${NETCORE_IMAGE_TEMPLATE:-waba_image}
      NETCORE_DOCUMENT_TEMPLATE: ${NETCORE_DOCUMENT_TEMPLATE:-waba_pdf}
      NETCORE_IMAGE_TEMPLATE_PARAM_COUNT: ${NETCORE_IMAGE_TEMPLATE_PARAM_COUNT:-0}
      NETCORE_DOCUMENT_TEMPLATE_PARAM_COUNT: ${NETCORE_DOCUMENT_TEMPLATE_PARAM_COUNT:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://labmate.bhasinpathlabs.com:4672}
      FAIL_HOST: 10.1.1.51
      VENE_HOST: 10.1.1.53
      WHATSAPP_API_URL: http://10.1.1.44:3004/api/messages/send
      ISSABEL_HOST: 10.1.1.67
      ISSABEL_PORT: 8002
      ISSABEL_WS_URL: ws://10.1.1.67:8002
      PEPIPOST_WA_ENABLED: ${PEPIPOST_WA_ENABLED:-1}
      PEPIPOST_BOOKING_TEMPLATE: ${PEPIPOST_BOOKING_TEMPLATE:-arpra_booking}
      PEPIPOST_ASSIGNMENT_TEMPLATE: ${PEPIPOST_ASSIGNMENT_TEMPLATE:-newassignment}
      PEPIPOST_WA_TIMEOUT: ${PEPIPOST_WA_TIMEOUT:-8}
      PEPIPOST_WA_TOKEN: ${PEPIPOST_WA_TOKEN:-}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: arpra-neo-mariadb
    ports:
      - "3306:3306"
    command: ["--default-time-zone=+05:30"]
    environment:
      TZ: Asia/Kolkata
      MARIADB_ROOT_PASSWORD: arpra_root_pass
      MARIADB_DATABASE: lead_management
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init/00-create-extra-dbs.sql:/docker-entrypoint-initdb.d/00-create-extra-dbs.sql:ro
      - ./lead_management.sql:/docker-entrypoint-initdb.d/01-lead_management.sql:ro
      - ./docker/mariadb/init/02-bhasin_7001_new.sql:/docker-entrypoint-initdb.d/02-bhasin_7001_new.sql:ro
      - ./docker/mariadb/init/04-hc-tms-status.sql:/docker-entrypoint-initdb.d/04-hc-tms-status.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: arpra-neo-phpmyadmin
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: arpra_root_pass
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 256M
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
