{% extends 'base.html' %}
{% block title %}HC Batch Docs{% endblock %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  .hc-batch-doc-page{background:#f4f6fb;font:13px "Segoe UI",Arial,sans-serif;color:#0f172a;padding:12px}
  .filter-card,.metric{background:#fff;border:1px solid #d9e1ef;border-radius:8px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .filter-card{padding:7px 10px;margin-bottom:10px;background:linear-gradient(180deg,#a2c5e5 0%,#d8c09a 100%);border:1px solid #7ea6c4}
  .filter-grid{display:grid;grid-template-columns:150px 160px 190px minmax(360px,1fr) 110px;gap:8px;align-items:end}
  .filter-label{display:block;color:#0f172a;font-weight:750;font-size:11px;margin:0 0 3px;text-transform:uppercase}
  .metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-end}
  .metric{padding:3px 8px;min-height:0;border-radius:999px;display:inline-flex;align-items:center;gap:5px;border:1px solid #cdd8ea;box-shadow:0 1px 2px rgba(15,23,42,.08)}
  .metric .k{display:inline;color:#0f172a;font-size:11px;font-weight:700;text-transform:none}
  .metric .v{display:inline;color:#0b1f4d;font-size:18px;font-weight:900;line-height:1;margin-top:0}
  .metric-batches{background:#e8f0ff}
  .metric-appts{background:#fff3c4}
  .metric-patients{background:#def7e8}
  .metric-docs{background:#ffe4e6}
  .cardx{background:#e9effa;border:1px solid #bccbe2;border-radius:10px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .batch-head{display:grid;grid-template-columns:28px 180px 1fr 120px;gap:8px;align-items:center;padding:10px;background:#d7e4f7}
  .appt-head{display:grid;grid-template-columns:28px 160px 1fr 100px;gap:8px;align-items:center;padding:8px 10px 8px 36px;border-top:1px solid #cbd8ea;background:#f6f9ff}
  .code{font-weight:800;color:#0b1f4d}.muted{color:#64748b}
  .urgent-batch-chip{display:inline-flex;align-items:center;gap:4px;margin-left:7px;color:#b91c1c;font-weight:900;font-size:12px}
  .urgent-batch-chip::before{content:"";width:8px;height:8px;border-radius:999px;background:#dc2626;display:inline-block}
  .rowtype-appointment{color:#15803d !important;font-weight:900 !important}
  .chip{display:inline-block;border:1px solid #cfe0ff;background:#eef4ff;color:#193a7a;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;margin:2px 4px 0 0}
  .patient{border-top:1px solid #cfdced;background:#eef4fd;padding:8px 10px 10px 64px}
  .p-card{background:#ffffff;border:1px solid #c7d5e8;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px #8b95a5,inset 0 2px 6px rgba(55,65,81,.35)}
  .patient-name-badge{display:inline-block;background:#fecaca;color:#7f1d1d;font-weight:800;padding:1px 6px;border-radius:6px;border:1px solid #fca5a5}
  .p-head{padding:8px 10px;border-bottom:1px solid #e4e9f3;display:grid;grid-template-columns:1fr 160px;gap:8px}
  .patient-actions{display:flex;justify-content:flex-end;align-items:flex-start}
  .trf-btn{padding:2px 8px !important;min-height:24px !important;line-height:1.1;font-size:12px}
  .docs{padding:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .doc{border:1px solid #d9e1ef;border-radius:8px;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
  .doc-main{min-width:0;overflow:hidden}
  .doc-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc-actions{display:flex;gap:4px;flex-shrink:0}
  .btn-ico{width:28px;height:28px;padding:0}
  .batch-print-btn{padding:2px 8px !important;min-height:24px !important;line-height:1.1;font-size:12px}
  @media (max-width:1200px){.docs{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media (max-width:768px){.docs{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:1180px){.filter-grid{grid-template-columns:repeat(2,minmax(180px,1fr));}}
  .drawer{position:fixed;right:-620px;top:var(--hc-header-offset,0px);width:600px;max-width:96vw;height:calc(100vh - var(--hc-header-offset,0px));background:#fff;z-index:99;transition:right .2s;display:flex;flex-direction:column}
  .drawer.open{right:0}.backdrop{position:fixed;left:0;right:0;bottom:0;top:var(--hc-header-offset,0px);background:rgba(0,0,0,.35);display:none;z-index:98}.backdrop.show{display:block}
  .pre{padding:4px 6px;background:#111827;color:#fff;flex:1;overflow:auto;display:flex;align-items:center;justify-content:center}
  .pre img{max-width:100%;max-height:100%;object-fit:contain}
  .pre-nav{padding:2px 8px;border-top:1px solid #d9e1ef;display:flex;justify-content:space-between;align-items:center;background:#eaf0ff;position:sticky;bottom:0;z-index:5;margin-top:0;min-height:30px}
  .pre-nav .btn{background:#9a3412 !important;border-color:#7c2d12 !important;color:#fff !important;min-height:24px !important;line-height:1.1;padding:2px 10px !important}
  .pre-nav .btn:hover{background:#7c2d12 !important;border-color:#7c2d12 !important}
  .drawer-head{padding:1px 4px 1px 4px !important}
  .btn-close-red{background:#dc2626 !important;border-color:#dc2626 !important;color:#fff !important}
  .btn-close-red{padding-top:2px !important;padding-bottom:2px !important}
  .btn-close-red:hover{background:#b91c1c !important;border-color:#b91c1c !important;color:#fff !important}
  .page-title-row{display:flex;align-items:center;gap:10px}
  .page-title-row .title-icon{font-size:22px;color:#2563eb}
  .page-title-row h5{margin:0;color:#0b1f4d;font-weight:800}
  .page-title-row .title-pill{font-size:14px;font-weight:500;color:#64748b}
  @media print{
    body *{visibility:hidden !important}
    #printArea,#printArea *{visibility:visible !important}
    #printArea{display:block !important;position:absolute;left:0;top:0;width:100%;background:#fff}
    #printArea section{page-break-after:always}
  }
</style>

<div class="hc-batch-doc-page">
  <div class="mb-2">
    <div class="page-title-row">
      <i class="bi bi-box-seam-fill title-icon"></i>
      <h5>Completed HC Batch Handover <span class="title-pill">(Batch-wise completed appointments from the phlebo app for verification, document review, and printing.)</span></h5>
    </div>
  </div>
  <section class="filter-card">
    <div class="filter-grid">
      <div>
        <label class="filter-label" for="f-date">Date</label>
        <input id="f-date" type="date" class="form-control form-control-sm">
      </div>
      <div>
        <label class="filter-label" for="f-phlebo">Phlebo</label>
        <select id="f-phlebo" class="form-select form-select-sm"><option value="">All Phlebos</option></select>
      </div>
      <div>
        <label class="filter-label" for="f-status">Batch Status</label>
        <select id="f-status" class="form-select form-select-sm"><option value="">All</option></select>
      </div>
      <div>
        <label class="filter-label" for="f-search">Search</label>
        <input id="f-search" type="search" class="form-control form-control-sm" placeholder="Patient / Rider / Mobile">
      </div>
      <div>
        <button id="f-apply" class="btn btn-primary btn-sm w-100">Apply</button>
      </div>
    </div>
    <section class="metrics">
      <div class="metric metric-batches"><span class="k">Batches:</span><span class="v" id="m-batches">0</span></div>
      <div class="metric metric-appts"><span class="k">Appointments:</span><span class="v" id="m-appts">0</span></div>
      <div class="metric metric-patients"><span class="k">Patients:</span><span class="v" id="m-patients">0</span></div>
      <div class="metric metric-docs"><span class="k">Documents:</span><span class="v" id="m-docs">0</span></div>
    </section>
  </section>
  <div id="list" class="d-flex flex-column gap-2"></div>
</div>
<div id="bd" class="backdrop" onclick="closePreview()"></div>
<div id="dr" class="drawer">
  <div class="drawer-head border-bottom d-flex justify-content-between align-items-center"><strong id="dtitle">Document</strong><button class="btn btn-sm btn-close-red" onclick="closePreview()">Close</button></div>
  <div id="dpre" class="pre"></div>
  <div class="pre-nav">
    <button class="btn btn-outline-secondary btn-sm" onclick="prevFile()">Prev</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="nextFile()">Next</button>
  </div>
</div>
<div id="printArea" style="display:none"></div>

<script>
let data={batches:[]},flat=[],activeFiles=[],activeFileIdx=0,activeDocTitle='',visibleBatches=[];
let appliedFilters={phlebo:'',status:'',search:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function load(useInputs=false){
  const dDate=document.getElementById('f-date');
  const qs=new URLSearchParams();
  if(useInputs){
    if(dDate?.value)qs.set('date',dDate.value);
  }
  const url='/hhome-collection/batch-handover-ui-data'+(qs.toString()?`?${qs.toString()}`:'');
  fetch(url).then(r=>r.json()).then(j=>{data=j||{batches:[]};initFilters(useInputs);render();});
}
function initFilters(preserveInputs=false){
  const sPh=document.getElementById('f-phlebo');
  const sSt=document.getElementById('f-status');
  const dDate=document.getElementById('f-date');
  const todayIso=data.dateIso||new Date().toISOString().slice(0,10);
  const selectedIso=data.selectedDate||todayIso;
  if(dDate&&!preserveInputs)dDate.value=selectedIso;
  const prevPh=preserveInputs?String(sPh?.value||''):'';
  const prevSt=preserveInputs?String(sSt?.value||''):'';
  if(sPh)sPh.replaceChildren(new Option('All Phlebos',''));
  if(sSt)sSt.replaceChildren(new Option('All',''));
  const phs=[...new Set((data.batches||[]).map(b=>String(b.phleboName||'').trim()).filter(Boolean))];
  phs.forEach(v=>sPh.add(new Option(v,v)));
  const sts=[...new Set((data.batches||[]).map(b=>String(b.status||'').trim()).filter(Boolean))];
  sts.forEach(v=>sSt.add(new Option(v,v)));
  if(sPh&&prevPh&&phs.includes(prevPh))sPh.value=prevPh;
  if(sSt&&prevSt&&sts.includes(prevSt))sSt.value=prevSt;
  appliedFilters.phlebo=String(sPh?.value||'').trim();
  appliedFilters.status=String(sSt?.value||'').trim();
  appliedFilters.search=String(document.getElementById('f-search')?.value||'').trim();
}
function syncHeaderOffset(){const hw=document.querySelector('.header-wrap');const off=hw?Math.max(0,Math.round(hw.getBoundingClientRect().bottom)):0;document.documentElement.style.setProperty('--hc-header-offset',off+'px');}
function render(){flat=[];const el=document.getElementById('list');el.innerHTML='';const q=String(appliedFilters.search||'').trim().toLowerCase();const ph=String(appliedFilters.phlebo||'').trim();const st=String(appliedFilters.status||'').trim();visibleBatches=(data.batches||[]).filter(b=>{if(ph && String(b.phleboName||'').trim()!==ph) return false;if(st && String(b.status||'').trim()!==st) return false;if(!q) return true;const blob=[b.riderName,b.phleboName,b.handoverTo,...(b.appointments||[]).flatMap(a=>[...(a.patients||[]).flatMap(p=>[p.name,p.mobile||''])])].join(' ').toLowerCase();return blob.includes(q);});visibleBatches.forEach((b,bi)=>{const sec=document.createElement('section');sec.className='cardx';const aps=(b.appointments||[]);const rider=String(b.riderName||'').trim();const handover=String(b.handoverTo||'').trim().toLowerCase()==='rider'?(rider?`${rider} Rider`:'Rider'):'Lab';const phlebo=String(b.phleboName||'').trim()||'-';const urgent=b.hasUrgent?'<span class="urgent-batch-chip">Urgent</span>':'';sec.innerHTML=`<div class="batch-head" data-bs-toggle="collapse" data-bs-target="#b-${bi}"><div><i class="bi bi-chevron-right"></i></div><div><div class="code">${esc(b.batchId)}${urgent}</div><div class="muted">${esc(b.deviceId||'')} | ${esc(b.createdAt||'')}</div></div><div><strong>Handover To:</strong> ${esc(handover)} &nbsp; | &nbsp; <strong>Phlebo:</strong> ${esc(phlebo)}</div><div class="text-end"><button class="btn btn-outline-primary btn-sm batch-print-btn" onclick="event.stopPropagation();printBatch(${bi})"><i class="bi bi-printer"></i> Print</button></div></div><div id="b-${bi}" class="collapse">${aps.map((a,ai)=>apptHtml(a,b,bi,ai)).join('')}</div>`;el.appendChild(sec);});updateMetrics();}
function updateMetrics(){const b=visibleBatches||[];const a=b.reduce((s,x)=>s+((x.appointments||[]).length),0);const p=b.reduce((s,x)=>s+(x.appointments||[]).reduce((k,ap)=>k+((ap.patients||[]).length),0),0);const d=b.reduce((s,x)=>s+(x.appointments||[]).reduce((k,ap)=>k+(ap.patients||[]).reduce((z,pt)=>z+((pt.docs||[]).filter(dd=>Array.isArray(dd.files)&&dd.files.length>0).length),0),0),0);document.getElementById('m-batches').textContent=b.length;document.getElementById('m-appts').textContent=a;document.getElementById('m-patients').textContent=p;document.getElementById('m-docs').textContent=d;}
function apptHtml(a,b,bi,ai){const ps=a.patients||[];const rt=String(a.rowType||'BOOKING').toUpperCase();const rtLabel=rt==='APPOINTMENT'?'Link Appointment':'New Appointment';const rtClass=rt==='APPOINTMENT'?'rowtype-appointment':'muted';return `<div class="appt-head" data-bs-toggle="collapse" data-bs-target="#a-${bi}-${ai}"><div><i class="bi bi-chevron-right"></i></div><div><div class="code">${esc(a.bookingCode||'')}</div><div class="${rtClass}">${esc(rtLabel)}</div></div><div>${esc(a.colony||'')} / ${esc(a.route||'')} | ${esc(a.slot||'')}</div><div class="text-end">${ps.length} patient(s)</div></div><div id="a-${bi}-${ai}" class="collapse"><div class="patient">${ps.map(p=>patientHtml(p,a,b)).join('')}</div></div>`;}
function patientHtml(p,a,b){
  const ageGender=`${p.age||''}/${p.gender||''}`.replace(/^\//,'').replace('/$','');
  const t=(p.tests||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  const tubes=(p.tubes||[]).map(x=>`<span class="chip" style="background:#edfff4;border-color:#b8f0cf;color:#166534">${esc(x)}</span>`).join('');
  const docs=(p.docs||[]).filter(d=>Array.isArray(d.files)&&d.files.length>0).map(d=>{flat.push({...d,b,p,a});return `<div class="doc"><div class="doc-main"><strong class="doc-title">${esc(d.type)} (${d.files.length})</strong></div><div class="doc-actions"><button class="btn btn-light border btn-sm btn-ico" onclick="preview('${esc(d.id)}')"><i class="bi bi-eye"></i></button><button class="btn btn-light border btn-sm btn-ico" onclick="printOne('${esc(d.id)}')"><i class="bi bi-printer"></i></button></div></div>`;}).join('');
  const bid = Number(p.bookingId||0);
  const pid = Number(p.patientId||0);
  const apptId=Number(a?.appointmentId||0);
  return `<div class="p-card"><div class="p-head"><div><div><strong>Name:-</strong> <span class="patient-name-badge">${esc(p.name||'')}</span> &nbsp;&nbsp; <strong>Age:-</strong> ${esc(ageGender||'-')} &nbsp;&nbsp; <strong>Test:-</strong> ${t || '<span class="muted">-</span>'} &nbsp;&nbsp; <strong>Sample Tubes:-</strong> ${tubes || '<span class="muted">-</span>'}</div></div><div class="patient-actions"><button class="btn btn-outline-primary btn-sm trf-btn" onclick="printPatientTrf(${bid},${pid},${apptId})"><i class="bi bi-printer"></i> Print TRF</button></div></div><div class="docs">${docs || '<div class="muted">No uploaded documents</div>'}</div></div>`;
}
function find(id){return flat.find(x=>x.id===id);} 
function renderActiveFile(){const box=document.getElementById('dpre');if(!activeFiles.length){box.innerHTML='<div>No image</div>';return;}const f=activeFiles[activeFileIdx]||activeFiles[0];box.innerHTML=`<img src="${esc(f.url)}" alt="${esc(f.name||'doc')}">`;}
function preview(id){const d=find(id);if(!d)return;activeFiles=(d.files||[]);activeFileIdx=0;activeDocTitle=d.type;document.getElementById('dtitle').textContent=`${d.type} (${activeFiles.length})`;renderActiveFile();document.getElementById('dr').classList.add('open');document.getElementById('bd').classList.add('show');}
function closePreview(){document.getElementById('dr').classList.remove('open');document.getElementById('bd').classList.remove('show');}
function prevFile(){if(!activeFiles.length)return;activeFileIdx=(activeFileIdx-1+activeFiles.length)%activeFiles.length;renderActiveFile();}
function nextFile(){if(!activeFiles.length)return;activeFileIdx=(activeFileIdx+1)%activeFiles.length;renderActiveFile();}
function absUrl(u){
  const s=String(u||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  return `${window.location.origin}${s.startsWith('/')?'':'/'}${s}`;
}
function htmlPages(arr){const rows=[];arr.forEach(d=>{(d.files||[]).forEach(f=>{const src=absUrl(f.url);rows.push(`<section style="page-break-after:always;padding:20px"><h3>${esc(d.type)}</h3><img src="${esc(src)}" style="max-width:100%;max-height:90vh;object-fit:contain"><div style="font-size:11px;color:#475569;margin-top:6px">${esc(f.name||'')}</div></section>`);});});return rows.join('');}
function buildPatientPrintPlanForBatch(bi){
  const batch=visibleBatches[bi]||{};
  const appts=Array.isArray(batch.appointments)?batch.appointments:[];
  const groups={};
  const order=[];
  appts.forEach((a)=>{
    const list=Array.isArray(a.patients)?a.patients:[];
    list.forEach(p=>{
      const pid=Number(p.patientId||0);
      const key=pid
        ? `pid:${pid}`
        : `name:${String(p.name||'').trim().toLowerCase()}|mob:${String(p.mobile||'').trim()}`;
      if(!groups[key]){
        groups[key]={bookingTrfUrls:[], appointmentTrfUrls:[], docs:[], _docSeen:new Set()};
        order.push(key);
      }
      const bid=Number(p.bookingId||0);
      if(bid && pid){
        const aid=Number(a.appointmentId||0);
        const url=`/hhome-collection/trf-patient-preview?booking_id=${encodeURIComponent(String(bid))}&patient_id=${encodeURIComponent(String(pid))}${aid?`&appointment_id=${encodeURIComponent(String(aid))}`:''}&autoprint=0`;
        const rt=String(a.rowType||'BOOKING').toUpperCase();
        if(rt==='APPOINTMENT') groups[key].appointmentTrfUrls.push(url);
        else groups[key].bookingTrfUrls.push(url);
      }
      (p.docs||[]).forEach(d=>{
        (d.files||[]).forEach(f=>{
          const docKey=(absUrl(f.url)||String(f.name||'').trim()).toLowerCase();
          if(!docKey || groups[key]._docSeen.has(docKey)) return;
          groups[key]._docSeen.add(docKey);
          groups[key].docs.push({type:d.type, files:[f]});
        });
      });
    });
  });
  return order.map(k=>groups[k]).filter(Boolean);
}
function doPrint(arr){
  if(!arr.length){alert('No documents selected.');return;}
  const seen=new Set();
  const deduped=[];
  arr.forEach(d=>{
    (d.files||[]).forEach(f=>{
      const key=(absUrl(f.url)||String(f.name||'').trim()).toLowerCase();
      if(!key || seen.has(key)) return;
      seen.add(key);
      deduped.push({...d,files:[f]});
    });
  });
  if(!deduped.length){alert('No documents selected.');return;}
  const pages=htmlPages(deduped);
  const iframe=document.createElement('iframe');
  iframe.style.position='fixed';
  iframe.style.right='0';
  iframe.style.bottom='0';
  iframe.style.width='0';
  iframe.style.height='0';
  iframe.style.border='0';
  iframe.setAttribute('aria-hidden','true');
  document.body.appendChild(iframe);
  const doc=iframe.contentWindow?.document;
  if(!doc){alert('Unable to open print frame.');iframe.remove();return;}
  doc.open();
  doc.write(`<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Batch Documents Print</title>
  <style>
    body{margin:0;background:#fff;font:13px "Segoe UI",Arial,sans-serif;color:#0f172a}
    section{page-break-after:always;padding:20px}
    img{max-width:100%;max-height:90vh;object-fit:contain}
    h3{margin:0 0 8px}
  </style>
</head>
<body>${pages}</body>
</html>`);
  doc.close();
  const imgs=Array.from(doc.querySelectorAll('img'));
  const cleanup=()=>setTimeout(()=>{try{iframe.remove();}catch(_e){}},500);
  if(!imgs.length){
    try{iframe.contentWindow?.focus();iframe.contentWindow?.print();}catch(_e){}
    cleanup();
    return;
  }
  let done=0;
  const finish=()=>{done+=1;if(done>=imgs.length){setTimeout(()=>{try{iframe.contentWindow?.focus();iframe.contentWindow?.print();}catch(_e){} cleanup();},60);}};
  imgs.forEach(img=>{
    if(img.complete){finish();return;}
    img.addEventListener('load',finish,{once:true});
    img.addEventListener('error',finish,{once:true});
  });
}
function printOne(id){const d=find(id);if(d)doPrint([d]);}
function printPatientTrf(bookingId, patientId, appointmentId){
  const bid=Number(bookingId||0);
  const pid=Number(patientId||0);
  if(!bid || !pid){alert('Invalid booking/patient for TRF print.');return;}
  const aid=Number(appointmentId||0);
  const url=`/hhome-collection/trf-patient-preview?booking_id=${encodeURIComponent(String(bid))}&patient_id=${encodeURIComponent(String(pid))}${aid?`&appointment_id=${encodeURIComponent(String(aid))}`:''}`;
  const w=window.open(url,'_blank');
  if(!w){alert('Please allow popups to print TRF.');return;}
  w.onload=()=>{try{w.print();}catch(_e){}};
}
function printBatch(bi){
  const plan=buildPatientPrintPlanForBatch(bi);
  if(!plan.length){alert('No documents selected.');return;}
  const pages=[];
  plan.forEach(g=>{
    (g.bookingTrfUrls||[]).forEach(u=>{
      pages.push(`<section class="print-page trf-page"><iframe class="trf-frame" src="${esc(u)}" style="width:100%;height:1030px;border:0;display:block"></iframe></section>`);
    });
    (g.appointmentTrfUrls||[]).forEach(u=>{
      pages.push(`<section class="print-page trf-page"><iframe class="trf-frame" src="${esc(u)}" style="width:100%;height:1030px;border:0;display:block"></iframe></section>`);
    });
    (g.docs||[]).forEach(d=>{
      const f=(d.files||[])[0]||{};
      const src=absUrl(f.url);
      pages.push(`<section class="print-page doc-page"><h3>${esc(d.type)}</h3><img src="${esc(src)}" style="max-width:100%;max-height:90vh;object-fit:contain"><div style="font-size:11px;color:#475569;margin-top:6px">${esc(f.name||'')}</div></section>`);
    });
  });
  const html=pages.join('');
  if(!html){alert('No documents selected.');return;}

  const pf=document.createElement('iframe');
  pf.style.position='fixed';pf.style.right='0';pf.style.bottom='0';pf.style.width='0';pf.style.height='0';pf.style.border='0';
  pf.setAttribute('aria-hidden','true');
  document.body.appendChild(pf);
  const doc=pf.contentWindow?.document;
  if(!doc){alert('Unable to open print frame.');pf.remove();return;}
  doc.open();
  doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>Batch Print</title><style>body{margin:0;background:#fff;font:13px "Segoe UI",Arial,sans-serif;color:#0f172a}.print-page{break-after:page;page-break-after:always;padding:0;margin:0}.print-page:last-child{break-after:auto;page-break-after:auto}.trf-page{padding:0}.trf-frame{height:1030px}.doc-page{padding:20px}.doc-page h3{margin:0 0 8px}@media print{.trf-frame{height:1000px}}</style></head><body>${html}</body></html>`);
  doc.close();

  const imgs=Array.from(doc.querySelectorAll('img'));
  const frames=Array.from(doc.querySelectorAll('iframe'));
  const total=imgs.length+frames.length;
  const cleanup=()=>setTimeout(()=>{try{pf.remove();}catch(_e){}},700);
  if(!total){
    try{pf.contentWindow?.focus();pf.contentWindow?.print();}catch(_e){}
    cleanup();
    return;
  }
  let done=0;
  const finish=()=>{done+=1;if(done>=total){setTimeout(()=>{try{pf.contentWindow?.focus();pf.contentWindow?.print();}catch(_e){} cleanup();},120);}};
  imgs.forEach(img=>{if(img.complete){finish();return;}img.addEventListener('load',finish,{once:true});img.addEventListener('error',finish,{once:true});});
  frames.forEach(fr=>{fr.addEventListener('load',finish,{once:true});fr.addEventListener('error',finish,{once:true});});
}
window.addEventListener('resize',syncHeaderOffset);
window.addEventListener('load',syncHeaderOffset);
document.getElementById('f-apply').addEventListener('click',function(){
  appliedFilters.phlebo=String(document.getElementById('f-phlebo')?.value||'').trim();
  appliedFilters.status=String(document.getElementById('f-status')?.value||'').trim();
  appliedFilters.search=String(document.getElementById('f-search')?.value||'').trim();
  load(true);
});
syncHeaderOffset();
load();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
