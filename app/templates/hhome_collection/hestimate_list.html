{% extends 'base.html' %}
{% block title %}Estimate List{% endblock %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/happ.css', v='20260609-1') }}">
<style>
  .estimate-list-page{max-width:none;width:100%;margin:0 auto;padding-left:0!important;padding-right:0!important;}
  .estimate-list-shell{background:#fff;border:1px solid #dbe7f5;border-radius:8px;box-shadow:0 6px 18px rgba(15,23,42,.08);overflow:hidden;}
  .estimate-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#fff;border-bottom:1px solid #dbe7f5;}
  .estimate-list-head h4{font-size:16px;font-weight:900;margin:0;color:#10233f;}
  .estimate-list-tools{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
  .estimate-list-tools .form-control{height:31px;min-height:31px;font-size:13px;border-radius:6px;}
  .estimate-list-search{width:220px;}
  .estimate-list-date{width:145px;}
  .estimate-list-actions .btn{padding-top:1px!important;padding-bottom:1px!important;}
  .estimate-list-table th{background:#0f766e;color:#fff;font-size:13px;white-space:nowrap;}
  .estimate-list-table td{font-size:13px;vertical-align:middle;}
  .estimate-patient-name{font-size:14px;font-weight:700;}
  .estimate-patient-mobile{font-size:13px;font-weight:400;}
  .estimate-list-actions{display:flex;gap:7px;justify-content:flex-end;white-space:nowrap;}
  .estimate-empty-row{padding:22px;text-align:center;font-weight:800;color:#64748b;}
  @media (max-width:768px){.estimate-list-actions{justify-content:flex-start}.estimate-list-table{min-width:760px;}}
</style>

<div class="container-fluid py-2 estimate-list-page">
  <div class="estimate-list-shell">
    <div class="estimate-list-head">
      <h4>Estimate List</h4>
      <div class="estimate-list-tools">
        <input type="search" class="form-control form-control-sm estimate-list-search" id="estimate-list-search" placeholder="Search name / mobile">
        <input type="date" class="form-control form-control-sm estimate-list-date" id="estimate-list-from">
        <input type="date" class="form-control form-control-sm estimate-list-date" id="estimate-list-to">
        <button type="button" class="btn btn-outline-primary btn-sm" id="estimate-list-apply">Apply</button>
        <a class="btn btn-primary btn-sm" href="{{ url_for('hhome_collection.estimate_page') }}">Create Estimate</a>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-bordered table-sm mb-0 estimate-list-table">
        <thead>
          <tr>
            <th style="width:80px;">ID</th>
            <th>Patient Name</th>
            <th style="width:170px;">Created At</th>
            <th style="width:150px;">Created By</th>
            <th class="text-end" style="width:130px;">Grand Total</th>
            <th class="text-end" style="width:170px;">Action</th>
          </tr>
        </thead>
        <tbody id="estimate-list-body">
          <tr><td colspan="6" class="estimate-empty-row">Loading estimates...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
  window.HC_ESTIMATE_LOGO_URL = "{{ url_for('static', filename='assets/Logo1.png') }}";
</script>
<script defer src="{{ url_for('static', filename='js/hestimate.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/hestimate_list.js') }}"></script>
{% endblock %}
