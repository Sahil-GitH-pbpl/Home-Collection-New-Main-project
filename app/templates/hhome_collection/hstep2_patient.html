<div id="step2-wrap">
  <h5>Step 2 - Appointment Booking</h5>
  <div class="row g-2">
    <div class="col-md-5"><label class="form-label">Preferred Visit Date *</label><input type="text" id="b-date" class="form-control" placeholder="dd/mm/yyyy" autocomplete="off" required></div>
    <div class="col-md-5">
      <label class="form-label">Schedule Time *</label>
      <input type="text" id="b-slot" class="form-control" placeholder="Select from Slots planner" readonly required>
    </div>
    <div class="col-md-2 d-grid">
      <label class="form-label d-none d-md-block">&nbsp;</label>
      <button class="btn btn-dark" id="btn-open-slots">Slots</button>
    </div>
    <div class="col-md-4 tb-panel-wrap">
      <label class="form-label">Referred By</label>
      <input type="text" id="ap-referred-by" class="form-control" placeholder="Type 2 letters to search">
      <div id="ap-referred-by-suggest" class="tb-panel-suggest d-none"></div>
    </div>
    <div class="col-md-4 tb-panel-wrap">
      <label class="form-label">Internal Referenced By</label>
      <input type="text" id="ap-internal-ref" class="form-control" placeholder="Type 2 letters to search">
      <div id="ap-internal-ref-suggest" class="tb-panel-suggest d-none"></div>
    </div>
    <div class="col-md-4">
      <label class="form-label">Lead ID</label>
      <input type="text" id="ap-lead-id" class="form-control" placeholder="Enter lead id">
    </div>
    <div class="col-12 d-none"><label class="form-label">Remarks</label><textarea id="b-remarks" class="form-control"></textarea></div>
  </div>

  <div class="mt-3">
    <button class="btn btn-outline-secondary" id="btn-back-step1">Back</button>
    <button class="btn btn-primary next-btn" id="btn-go-step3">Next <span class="next-arrow">&#8594;</span></button>
  </div>
</div>

<div class="modal fade slot-modal" id="slotPlannerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h5 class="modal-title">Route Wise Slots</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-2">
        <div class="row g-2 align-items-end mb-2">
          <div class="col-md-3">
            <label class="form-label">Date</label>
            <input type="text" id="slot-grid-date" class="form-control" placeholder="dd/mm/yyyy" autocomplete="off">
          </div>
          <div class="col-md-3">
            <label class="form-label">Selected Route</label>
            <input type="text" id="slot-selected-route" class="form-control" readonly>
          </div>
          <div class="col-md-6 text-md-end small text-muted" id="slot-grid-meta"></div>
        </div>
        <div id="slot-grid-wrap" class="slot-grid-wrap">
          <div class="text-muted p-2">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>
